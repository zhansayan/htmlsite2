    <title>Барчикова</title>

<body>
<h1 align=center>Осенние листочки</h1>

<p align=left><font color=red>Листочки танцуют, листочки кружатся</font><br> 
<b>И ярким ковром мне под ноги ложатся</b> <br></p>

<p align=left><u>Как будто ужасно они занятые,</u><br> 
<b color=green><font>Зелёные</font>, <font color=red>красные</font> и <font color=gold>золотые…</font></b> <br></p>

<p align=center>Листья кленовые, листья дубовые,<br> 
<font color=orange>Пурпурные, алые, даже бордовые…</font><br></p>

<p align=right>Бросаюсь я листьями вверх наугад — <br>
<b><font color=red>Я тоже устроить могу листопад!</font></b> <br></p>

<h3 align=right>Ю.Каспарова</h3>
</body>
</html>
